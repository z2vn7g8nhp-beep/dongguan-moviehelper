name: 东莞IMAX开票雷达 (每分钟探测与多轮提醒)

on:
  schedule:
    # GitHub Actions 官方 cron 最短 5 分钟一次；
    # 如需单次 job 内按每 60s±12s 连续巡检，请启用下方 LOOP_ROUNDS=4
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      loop_rounds:
        description: '单次任务连续探测轮次 (1=单次, 4=连续约4分钟)'
        required: false
        default: '4'

permissions:
  contents: read

jobs:
  monitor-dongguan-imax:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 恢复多轮已提醒场次状态缓存
        uses: actions/cache@v4
        with:
          path: .monitor-cache/seen-shows.json
          key: dongguan-imax-seen-${{ github.run_id }}
          restore-keys: |
            dongguan-imax-seen-

      - name: 执行东莞三家影院开票探测 (带猫眼风控熔断保护)
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          BARK_URL: ${{ secrets.BARK_URL }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          MAOYAN_COOKIE: ${{ secrets.MAOYAN_COOKIE }}
          BASE_INTERVAL_SEC: '60'
          JITTER_SEC: '12'
          LOOP_ROUNDS: ${{ github.event.inputs.loop_rounds || '4' }}
        run: node scripts/monitor-dongguan.mjs
